<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نمایشگر مارک‌دون فارسی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&family=Noto+Naskh+Arabic:wght@400;500;700&family=Amiri:wght@400;700&family=Harmattan:wght@400;500;700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Markazi+Text:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#1c2430; --muted:#5d6878; --line:#dde2ea;
  --accent:#2c4fa3; --accent-ink:#ffffff; --code-bg:#eef1f6; --quote:#e9eefb; --mark:#fff2b3;
  --reader-font:'Vazirmatn',system-ui,sans-serif; --reader-size:18px; --reader-lh:1.95;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --panel:#171b22; --ink:#e6e9ee; --muted:#9aa4b2; --line:#2a313c;
    --accent:#7fb8d8; --accent-ink:#0d1620; --code-bg:#1f2530; --quote:#1b2432; --mark:#5a4b12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#171b22; --ink:#e6e9ee; --muted:#9aa4b2; --line:#2a313c;
  --accent:#7fb8d8; --accent-ink:#0d1620; --code-bg:#1f2530; --quote:#1b2432; --mark:#5a4b12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',system-ui,sans-serif;display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:.6rem .9rem;align-items:center;padding:.7rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:1.05rem;margin:0 0 0 .5rem;font-weight:800}
.group{display:flex;align-items:center;gap:.4rem}
label.lbl{font-size:.8rem;color:var(--muted)}
select,button,input[type=range]{font:inherit;font-size:.88rem}
select,button{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.4rem .7rem;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{width:90px;accent-color:var(--accent)}
.spacer{flex:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
main[data-view="edit"]{grid-template-columns:1fr}
main[data-view="preview"]{grid-template-columns:1fr}
main[data-view="edit"] #reader-wrap,main[data-view="preview"] #editor-wrap{display:none}
#editor-wrap{display:flex;flex-direction:column;border-inline-start:1px solid var(--line);min-height:0}
#editor-wrap .bar{padding:.4rem .8rem;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
textarea{flex:1;width:100%;resize:none;border:0;padding:1rem;background:var(--panel);color:var(--ink);font:15px/1.7 ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:plaintext;text-align:start}
textarea:focus{outline:none}
#reader-wrap{overflow:auto;min-height:0;position:relative}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);border:2px dashed var(--accent);font-size:1.2rem;z-index:5}
body.dragging #drop{display:flex}
article{max-width:46rem;margin:0 auto;padding:2rem 1.4rem 4rem;font-family:var(--reader-font);font-size:var(--reader-size);line-height:var(--reader-lh)}
article[data-dir="rtl"]{direction:rtl}
article[data-dir="ltr"]{direction:ltr}
article h1,article h2,article h3,article h4{line-height:1.5;margin:1.8em 0 .6em;font-weight:700}
article h1{font-size:1.9em;border-bottom:2px solid var(--accent);padding-bottom:.25em}
article h2{font-size:1.5em;border-bottom:1px solid var(--line);padding-bottom:.2em}
article h3{font-size:1.25em}
article p,article li{margin:.7em 0}
article a{color:var(--accent)}
article blockquote{margin:1.2em 0;padding:.4em 1.1em;background:var(--quote);border-inline-start:4px solid var(--accent);border-radius:6px}
article blockquote p{margin:.4em 0}
article code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--code-bg);padding:.12em .4em;border-radius:5px;direction:ltr;unicode-bidi:isolate}
article pre{background:var(--code-bg);padding:1rem;border-radius:10px;overflow-x:auto;direction:ltr;text-align:left;line-height:1.6;border:1px solid var(--line)}
article pre code{background:none;padding:0}
article table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:1.2em 0}
article th,article td{border:1px solid var(--line);padding:.45em .8em;text-align:start}
article th{background:var(--code-bg)}
article img{max-width:100%;border-radius:8px}
article hr{border:0;border-top:1px solid var(--line);margin:2em 0}
article ul,article ol{padding-inline-start:1.6em}
article li input[type=checkbox]{margin-inline-end:.4em}
.empty{color:var(--muted);text-align:center;margin-top:4rem}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  main[data-view="split"] #reader-wrap{display:none}
  header h1{width:100%}
}
@media print{
  header,#editor-wrap,#drop{display:none!important}
  html,body,main,#reader-wrap{height:auto;overflow:visible;display:block}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<header>
  <h1>نمایشگر مارک‌دون</h1>
  <div class="group">
    <button class="primary" id="open">باز کردن فایل</button>
    <input type="file" id="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
  </div>
  <div class="group">
    <label class="lbl" for="font">فونت</label>
    <select id="font">
      <option value="'Vazirmatn',system-ui,sans-serif">وزیرمتن</option>
      <option value="'Noto Naskh Arabic',serif">نسخ</option>
      <option value="'Amiri',serif">امیری</option>
      <option value="'Harmattan',sans-serif">هارماتان</option>
      <option value="'Noto Kufi Arabic',sans-serif">کوفی</option>
      <option value="'Markazi Text',serif">مرکزی</option>
    </select>
  </div>
  <div class="group">
    <label class="lbl" for="size">اندازه</label>
    <input type="range" id="size" min="14" max="28" step="1" value="18">
  </div>
  <div class="group">
    <label class="lbl" for="lh">فاصله خطوط</label>
    <input type="range" id="lh" min="14" max="26" step="1" value="19">
  </div>
  <div class="group">
    <button id="dir" title="جهت متن">راست‌چین</button>
    <button id="theme" title="تغییر تم">تم تیره</button>
  </div>
  <div class="spacer"></div>
  <div class="group" role="group" aria-label="حالت نمایش">
    <button data-v="edit">ویرایش</button>
    <button data-v="split">دو ستونه</button>
    <button data-v="preview">خواندن</button>
  </div>
  <button id="print">چاپ / PDF</button>
</header>
<main id="main" data-view="split">
  <section id="editor-wrap">
    <div class="bar"><span>متن مارک‌دون را اینجا بچسبانید</span><span id="count"></span></div>
    <textarea id="src" spellcheck="false" placeholder="# عنوان&#10;متن خود را اینجا بنویسید یا فایل را بکشید و رها کنید…"></textarea>
  </section>
  <section id="reader-wrap">
    <div id="drop">فایل را اینجا رها کنید</div>
    <article id="out" data-dir="rtl"></article>
  </section>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var src=$('src'),out=$('out'),main=$('main'),root=document.documentElement;
  var sample='# به نمایشگر مارک‌دون خوش آمدید\n\nاین یک **نمونه‌ی ساده** است. متن یا فایل مارک‌دون خود را جایگزین کنید تا با فونت و تم دلخواه نمایش داده شود.\n\n## امکانات\n\n- پشتیبانی کامل از راست‌به‌چپ\n- شش فونت فارسی\n- تم روشن و تیره\n- باز کردن فایل `.md` یا کشیدن و رها کردن\n\n> مارک‌دون برای نوشتن سریع و خوانا ساخته شده است.\n\n### جدول\n\n| ستون اول | ستون دوم |\n|---|---|\n| الف | ب |\n| ج | د |\n\n### کد\n\n```python\nprint("سلام دنیا")\n```\n\n- [x] کار انجام‌شده\n- [ ] کار باقی‌مانده\n';
  var st={};
  function load(){try{st=JSON.parse(localStorage.getItem('mdv')||'{}')}catch(e){st={}}}
  function save(){try{localStorage.setItem('mdv',JSON.stringify(st))}catch(e){}}
  load();

  function render(){
    var t=src.value;
    $('count').textContent=t.length?t.length.toLocaleString('fa-IR')+' نویسه':'';
    if(!t.trim()){out.innerHTML='<p class="empty">هنوز متنی وارد نشده است. متن را بچسبانید یا فایلی را باز کنید.</p>';return}
    if(!window.marked||!window.DOMPurify){out.textContent='بارگذاری کتابخانه‌ها ناموفق بود. اتصال اینترنت را بررسی کنید.';return}
    var html=DOMPurify.sanitize(marked.parse(t,{gfm:true,breaks:true}));
    out.innerHTML=html;
    out.querySelectorAll('p,li,h1,h2,h3,h4,h5,h6,blockquote,th,td').forEach(function(el){el.setAttribute('dir','auto')});
  }
  var timer;
  src.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(function(){render();st.text=src.value;save()},150)});

  function setTheme(m){
    root.setAttribute('data-theme',m);st.theme=m;save();
    $('theme').textContent=m==='dark'?'تم روشن':'تم تیره';
  }
  $('theme').onclick=function(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark')};

  function setFont(v){root.style.setProperty('--reader-font',v);$('font').value=v;st.font=v;save()}
  $('font').onchange=function(){setFont(this.value)};
  function setSize(v){root.style.setProperty('--reader-size',v+'px');$('size').value=v;st.size=v;save()}
  $('size').oninput=function(){setSize(this.value)};
  function setLh(v){root.style.setProperty('--reader-lh',(v/10).toFixed(1));$('lh').value=v;st.lh=v;save()}
  $('lh').oninput=function(){setLh(this.value)};

  function setDir(d){out.setAttribute('data-dir',d);st.dir=d;save();$('dir').textContent=d==='rtl'?'راست‌چین':'چپ‌چین'}
  $('dir').onclick=function(){setDir(out.getAttribute('data-dir')==='rtl'?'ltr':'rtl')};

  function setView(v){
    main.setAttribute('data-view',v);st.view=v;save();
    document.querySelectorAll('[data-v]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===v)});
  }
  document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){setView(b.dataset.v)}});

  function readFile(f){
    if(!f)return;
    var r=new FileReader();
    r.onload=function(){src.value=r.result;st.text=r.result;save();render();if(matchMedia('(max-width:820px)').matches)setView('preview')};
    r.readAsText(f,'utf-8');
  }
  $('open').onclick=function(){$('file').click()};
  $('file').onchange=function(){readFile(this.files[0]);this.value=''};
  ['dragenter','dragover'].forEach(function(e){window.addEventListener(e,function(ev){ev.preventDefault();document.body.classList.add('dragging')})});
  ['dragleave','drop'].forEach(function(e){window.addEventListener(e,function(ev){ev.preventDefault();if(e==='drop'||ev.target===document.documentElement)document.body.classList.remove('dragging')})});
  window.addEventListener('drop',function(ev){readFile(ev.dataTransfer.files[0])});
  $('print').onclick=function(){window.print()};

  // init
  var dark=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches;
  setTheme(st.theme||(dark?'dark':'light'));
  if(st.font)setFont(st.font);
  if(st.size)setSize(st.size);
  if(st.lh)setLh(st.lh);
  setDir(st.dir||'rtl');
  setView(st.view||(matchMedia('(max-width:820px)').matches?'edit':'split'));
  src.value=st.text!=null?st.text:sample;
  render();
})();
</script>
</body>
</html>
